<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AudioVault Pro</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 450px; background: var(--card); padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { margin-top: 0; font-weight: 600; text-align: center; color: var(--accent); }
        .input-group { margin: 20px 0; }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; background: var(--accent); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: transform 0.1s; margin-top: 10px; }
        button:active { transform: scale(0.98); }
        button:disabled { background: #475569; opacity: 0.6; }
        #status-box { margin-top: 20px; padding: 15px; border-radius: 8px; background: #334155; font-size: 13px; display: none; }
        .info-popup { position: fixed; bottom: -100%; left: 0; width: 100%; background: var(--card); padding: 30px; border-radius: 20px 20px 0 0; transition: 0.3s; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); z-index: 100; }
        .info-popup.active { bottom: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>AudioVault Pro</h2>
        <div class="input-group">
            <input type="text" id="manualUrl" placeholder="Paste YouTube Link Here...">
            <button id="downloadBtn">Download Offline</button>
        </div>
        <div id="status-box"></div>
    </div>

    <div id="infoModal" class="info-popup">
        <h3 style="margin-top:0">App Statistics</h3>
        <p id="storageInfo">Storage Used: Calculating...</p>
        <p>Version: 2.0.4 (Enterprise Build)</p>
        <button onclick="toggleInfo()">Close</button>
    </div>

    <script src="/app.js"></script>
</body>
</html>
